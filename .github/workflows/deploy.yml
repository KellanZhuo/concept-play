name: CI & Deploy ConceptPlay to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python & Run AST Validator + Eval Dry-Run Tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Python test deps & run pytest
        run: |
          pip install pytest python-dotenv requests fastapi pydantic
          pytest backend/tests
          python eval/run_eval.py --dry-run

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies & run Vitest
        working-directory: frontend
        run: |
          npm ci
          npm run test

      - name: Build static production bundle for GitHub Pages
        working-directory: frontend
        env:
          VITE_BASE_PATH: "/concept-play/"
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./frontend/dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
